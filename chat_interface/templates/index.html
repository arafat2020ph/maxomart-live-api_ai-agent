<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxoMart AI Assistant</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
        }

        /* Glassmorphism Container */
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .chat-header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .ai-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .header-info h2 { font-size: 1.1rem; font-weight: 600; color: #f8fafc; }
        .header-info p { font-size: 0.8rem; color: #10b981; display: flex; align-items: center; gap: 5px; margin-top: 2px;}
        .header-info p::before { content: ''; display: block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

        /* Chat Box */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Hide Scrollbar */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Messages */
        .message-wrapper { display: flex; gap: 12px; width: 100%; animation: fadeIn 0.3s ease; }
        .message-wrapper.user { flex-direction: row-reverse; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-avatar {
            width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; flex-shrink: 0;
        }
        
        .user .msg-avatar { background: #3b82f6; color: white; }
        .ai .msg-avatar { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; }

        .message-content {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .message-content {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .ai .message-content {
            background: rgba(51, 65, 85, 0.8);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Markdown styling */
        .message-content a { color: #60a5fa; text-decoration: none; font-weight: 500; }
        .message-content a:hover { text-decoration: underline; }
        .message-content strong { color: #f8fafc; font-weight: 600; }
        .message-content ul, .message-content ol { padding-left: 20px; margin-top: 8px; margin-bottom: 8px; }
        .message-content li { margin-bottom: 5px; }

        /* Typing Indicator */
        .typing-indicator { display: flex; gap: 4px; padding: 10px 15px; background: rgba(51, 65, 85, 0.8); border-radius: 18px; width: fit-content; border-bottom-left-radius: 4px; }
        .typing-indicator span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Input Area */
        .input-container {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }
        
        .input-box:focus-within {
            border-color: #6366f1;
            background: rgba(51, 65, 85, 0.8);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            max-height: 100px;
            min-height: 24px;
            line-height: 1.5;
        }
        
        textarea::placeholder { color: #64748b; }

        button.send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        button.send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="ai-avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="header-info">
            <h2>MaxoMart Assistant</h2>
            <p>Online</p>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">
        <div class="message-wrapper ai">
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="message-content">
                Hello! I am your AI assistant powered by live data. How can I help you today?
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-box">
            <textarea id="message-input" rows="1" placeholder="Ask about products or your cart..."></textarea>
        </div>
        <button class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    let sessionId = null;
    const chatBox = document.getElementById('chat-box');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // Auto-resize textarea
    inputEl.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
        const message = inputEl.value.trim();
        if (!message) return;

        // 1. Add user message
        addMessage(message, 'user');
        inputEl.value = '';
        inputEl.style.height = 'auto';

        // 2. Add typing indicator
        const typingId = addTypingIndicator();

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, session_id: sessionId })
            });
            
            const data = await response.json();

            // Remove typing indicator
            document.getElementById(typingId).remove();
            
            // 3. Add AI response
            if (data.response) {
                addMessage(data.response, 'ai');
                sessionId = data.session_id;
            } else if (data.error) {
                addMessage("Error: " + data.error, 'ai');
            }

        } catch (error) {
            document.getElementById(typingId).remove();
            addMessage("Sorry, I am having trouble connecting right now.", 'ai');
        }
    }

    function addMessage(text, role) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
        
        const content = document.createElement('div');
        content.className = 'message-content';
        
        // Markdown Link Parser
        const linkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g;
        let htmlText = text.replace(linkRegex, '<a href="$2" target="_blank">$1</a>');
        
        // Convert newlines to <br>
        htmlText = htmlText.replace(/\n/g, '<br>');
        
        // Basic bold parser (**text**)
        htmlText = htmlText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        content.innerHTML = htmlText;

        wrapper.appendChild(avatar);
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        
        // Scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addTypingIndicator() {
        const id = 'typing-' + Date.now();
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper ai';
        wrapper.id = id;
        
        wrapper.innerHTML = `
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }
</script>

</body>
</html>
